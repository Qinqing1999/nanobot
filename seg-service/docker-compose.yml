services:
  seg-service:
    build: .
    image: seg-service:latest
    container_name: seg-service
    ports:
      - "8001:8001"
    environment:
      - ORT_THREADS=2
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 512m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      start_period: 30s
