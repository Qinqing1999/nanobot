services:
  seg-service:
    build: .
    image: seg-service:latest
    container_name: seg-service
    ports:
      - "8001:8001"
    environment:
      - MODEL_PATH=models/model_dynamic.onnx
      - ORT_THREADS=2
      - MAX_DIMENSION=1024
    restart: unless-stopped
    mem_limit: 1g
    memswap_limit: 1g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      start_period: 60s
