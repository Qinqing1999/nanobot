<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: linear-gradient(135deg, #1a73e8 0%, #0d47a1 50%, #01579b 100%);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .subtitle {
        font-size: 48px;
        color: rgba(255, 255, 255, 0.85);
        font-weight: 300;
        letter-spacing: 2px;
        opacity: 0;
      }
      .date {
        position: absolute;
        bottom: 60px;
        width: 100%;
        text-align: center;
        font-size: 32px;
        color: rgba(255, 255, 255, 0.7);
        font-weight: 300;
        letter-spacing: 4px;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="5"
      data-width="1920"
      data-height="1080"
    >
      <div class="title" data-start="0" data-duration="5" data-track-index="1"
           style="position: absolute; top: 400px; width: 100%; text-align: center;
                  font-size: 120px; color: #fff; font-weight: 700; letter-spacing: 4px;">
        Welcome to HyperFrames
      </div>
      
      <div class="subtitle" data-start="0" data-duration="5" data-track-index="2"
           style="position: absolute; top: 560px; width: 100%; text-align: center;">
        Powered by Nanobot + Agnes AI
      </div>
      
      <div class="date" data-start="0" data-duration="5" data-track-index="3">
        2026年08月18日
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      
      // 标题从上方滑入
      tl.from(".title", { 
        y: -100, 
        opacity: 0, 
        duration: 1, 
        ease: "power3.out" 
      }, 0)
      // 副标题淡入
      .to(".subtitle", { 
        opacity: 1, 
        duration: 1.2, 
        ease: "power2.inOut" 
      }, 1.8);
      
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
